<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Complete Your Profile</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <a href="index.html">Home</a>
  </nav>

  <!-- MAIN CONTENT -->
  <main class="container">
    <div class="card">
      <h1>Complete Your Profile</h1>
      <p class="notice">
        Please provide the following information to apply for membership.
      </p>

      <form id="profileForm">
        <input type="text" id="fullName" placeholder="Full Name" required>
        <input type="text" id="affiliation" placeholder="Affiliation" required>

        <select id="role" required>
          <option value="">Select Role</option>
          <option>Student</option>
          <option>Researcher</option>
          <option>Faculty</option>
          <option>Industry</option>
        </select>

        <input type="text" id="country" placeholder="Country" required>

        <textarea
          id="interest"
          placeholder="Research Interests"
          rows="4"
          required
        ></textarea>

        <!-- IMPORTANT -->
        <button type="submit" class="primary-btn">
          Submit Application
        </button>
      </form>
    </div>
  </main>

  <!-- FIREBASE LOGIC -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getFirestore, doc, setDoc } 
      from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

    console.log("Signup script loaded");

    /* 🔥 FIREBASE CONFIG (REPLACE WITH YOURS) */
    /* 🔥 FIREBASE CONFIG (REPLACE WITH YOURS) */
    const firebaseConfig = {
      apiKey: "AIzaSyCyfEhO3Q_eHGRfOMtHnnKzI523Lgz_bhI",
      authDomain: "computational-linguistic-1b41b.firebaseapp.com",
      projectId: "computational-linguistic-1b41b",
      storageBucket: "computational-linguistic-1b41b.firebasestorage.app",
      messagingSenderId: "408809821572",
      appId: "1:408809821572:web:33808243519db3e0e4f9d1",
      measurementId: "G-1Q62E3KX17"
    };


    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const uid = sessionStorage.getItem("signupUID");

    if (!uid) {
      alert("Session expired. Please login again.");
      window.location.href = "login.html";
    }

    const form = document.getElementById("profileForm");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();   // 🔴 REQUIRED
      console.log("Form submitted");

      try {
        await setDoc(doc(db, "users", uid), {
          fullName: document.getElementById("fullName").value,
          affiliation: document.getElementById("affiliation").value,
          role: document.getElementById("role").value,
          country: document.getElementById("country").value,
          interest: document.getElementById("interest").value,
          status: "pending",
          createdAt: new Date()
        });

        sessionStorage.removeItem("signupUID");

        alert("Application submitted successfully. Await admin approval.");
        window.location.href = "index.html";

      } catch (err) {
        console.error(err);
        alert("Error saving profile: " + err.message);
      }
    });
  </script>

</body>
</html>
