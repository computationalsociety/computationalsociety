<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Signup | Computational Linguistics Society</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="style.css" />

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";


    /* 🔥 FIREBASE CONFIG (REPLACE WITH YOURS) */
    /* 🔥 FIREBASE CONFIG (REPLACE WITH YOURS) */
    const firebaseConfig = {
      apiKey: "AIzaSyCyfEhO3Q_eHGRfOMtHnnKzI523Lgz_bhI",
      authDomain: "computational-linguistic-1b41b.firebaseapp.com",
      projectId: "computational-linguistic-1b41b",
      storageBucket: "computational-linguistic-1b41b.firebasestorage.app",
      messagingSenderId: "408809821572",
      appId: "1:408809821572:web:33808243519db3e0e4f9d1",
      measurementId: "G-1Q62E3KX17"
    };


    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Elements
    const form = document.getElementById("profileForm");
    const statusBox = document.getElementById("status");

    let currentUser = null;

    // 🔐 Check login
    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "login.html";
      } else {
        currentUser = user;
      }
    });

    // 📤 Submit profile
    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      if (!currentUser) {
        alert("User not authenticated");
        return;
      }

      const fullName = document.getElementById("fullName").value.trim();
      const affiliation = document.getElementById("affiliation").value.trim();
      const role = document.getElementById("role").value;
      const country = document.getElementById("country").value.trim();
      const interests = document.getElementById("interests").value.trim();

      if (!fullName || !affiliation || !role || !country) {
        alert("Please fill all required fields");
        return;
      }

      try {
        await setDoc(doc(db, "users", currentUser.uid), {
          fullName,
          affiliation,
          role,
          country,
          interests,
          email: currentUser.email,
          status: "pending",
          createdAt: serverTimestamp()
        });

        statusBox.innerHTML =
          "✅ Application submitted successfully.<br>Please wait for admin approval.";

        form.reset();

      } catch (error) {
        console.error(error);
        alert("Error saving profile. Check Firestore rules.");
      }
    });
  </script>
</head>

<body>
  <nav class="navbar">
    <a href="index.html">Home</a>
  </nav>

  <div class="container">
    <h2>Complete Your Profile</h2>
    <p>Please fill the form to apply for membership.</p>

    <form id="profileForm">
      <input type="text" id="fullName" placeholder="Full Name" required />
      <input type="text" id="affiliation" placeholder="Affiliation" required />

      <select id="role" required>
        <option value="">Select Role</option>
        <option value="Student">Student</option>
        <option value="Researcher">Researcher</option>
        <option value="Faculty">Faculty</option>
        <option value="Professional">Professional</option>
      </select>

      <input type="text" id="country" placeholder="Country" required />
      <textarea id="interests" placeholder="Research Interests"></textarea>

      <button type="submit">Submit Application</button>
    </form>

    <div id="status" class="status-box"></div>
  </div>
</body>
</html>
