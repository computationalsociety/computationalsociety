<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
  import { getAuth } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
  import { getFirestore, doc, setDoc } 
    from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCyfEhO3Q_eHGRfOMtHnnKzI523Lgz_bhI",
    authDomain: "computational-linguistic-1b41b.firebaseapp.com",
    projectId: "computational-linguistic-1b41b",
    storageBucket: "computational-linguistic-1b41b.firebasestorage.app",
    messagingSenderId: "408809821572",
    appId: "1:408809821572:web:33808243519db3e0e4f9d1",
    measurementId: "G-1Q62E3KX17"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const form = document.getElementById("profileForm");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const user = auth.currentUser;

    if (!user) {
      alert("Session expired. Please login again.");
      window.location.href = "login.html";
      return;
    }

    await setDoc(doc(db, "users", user.uid), {
      email: user.email,
      fullName: fullName.value,
      affiliation: affiliation.value,
      role: role.value,
      country: country.value,
      interest: interest.value,
      status: "pending",
      createdAt: new Date()
    });

    alert("Application submitted. Await admin approval.");
    window.location.href = "index.html";
  });
</script>
