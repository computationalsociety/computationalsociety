<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel | Computational Linguistics Society</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  <a href="index.html">Home</a>
  <a href="admin.html">Admin</a>
  <a href="#" id="logoutBtn">Logout</a>
</nav>

<div class="container">
  <h1>Admin Panel</h1>
  <p class="notice">Pending membership applications</p>

  <div id="userList">
    <p>Loading applications...</p>
  </div>
</div>

<script type="module">
  /* ===============================
     Firebase Imports
  =============================== */
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
  import { 
    getAuth, 
    onAuthStateChanged, 
    signOut 
  } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
  import { 
    getFirestore, 
    collection, 
    query, 
    where, 
    getDocs, 
    updateDoc, 
    doc 
  } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";
    // 🔐 Firebase configuration (SAME as other pages)
    const firebaseConfig = {
      apiKey: "AIzaSyCyfEhO3Q_eHGRfOMtHnnKzI523Lgz_bhI",
      authDomain: "computational-linguistic-1b41b.firebaseapp.com",
      projectId: "computational-linguistic-1b41b",
      storageBucket: "computational-linguistic-1b41b.firebasestorage.app",
      messagingSenderId: "408809821572",
      appId: "1:408809821572:web:33808243519db3e0e4f9d1",
      measurementId: "G-1Q62E3KX17"
    };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  /* ===============================
     ADMIN EMAILS (IMPORTANT)
  =============================== */
  const ADMINS = [
    "shoaibtahir410@gmail.com",
    "shoaibtahir411@gmail.com"
  ];

  const userList = document.getElementById("userList");

  /* ===============================
     Auth & Admin Check
  =============================== */
  onAuthStateChanged(auth, async (user) => {
    if (!user || !ADMINS.includes(user.email)) {
      alert("Access denied. Admins only.");
      window.location.href = "index.html";
      return;
    }

    loadPendingUsers();
  });

  /* ===============================
     Load Pending Users
  =============================== */
  async function loadPendingUsers() {
    userList.innerHTML = "";

    const q = query(
      collection(db, "users"),
      where("status", "==", "pending")
    );

    const snapshot = await getDocs(q);

    if (snapshot.empty) {
      userList.innerHTML = "<p>No pending applications.</p>";
      return;
    }

    snapshot.forEach((userDoc) => {
      const data = userDoc.data();

      const card = document.createElement("div");
      card.style.border = "1px solid #ddd";
      card.style.padding = "15px";
      card.style.marginBottom = "15px";
      card.style.borderRadius = "8px";

      card.innerHTML = `
        <strong>${data.fullName}</strong><br>
        ${data.email}<br>
        ${data.affiliation}<br>
        <em>${data.role}</em><br><br>

        <button data-id="${userDoc.id}" data-action="approve">
          Approve
        </button>

        <button data-id="${userDoc.id}" data-action="reject"
          style="background:#dc2626; margin-left:10px;">
          Reject
        </button>
      `;

      userList.appendChild(card);
    });

    attachActions();
  }

  /* ===============================
     Approve / Reject Logic
  =============================== */
  function attachActions() {
    document.querySelectorAll("button").forEach(btn => {
      btn.addEventListener("click", async () => {
        const uid = btn.dataset.id;
        const action = btn.dataset.action;

        await updateDoc(doc(db, "users", uid), {
          status: action === "approve" ? "approved" : "rejected"
        });

        loadPendingUsers();
      });
    });
  }

  /* ===============================
     Logout
  =============================== */
  document.getElementById("logoutBtn").addEventListener("click", async () => {
    await signOut(auth);
    window.location.href = "index.html";
  });
</script>

</body>
</html>
