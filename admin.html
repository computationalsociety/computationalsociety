<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Panel</title>
  <link rel="stylesheet" href="style.css" />

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import {
      getFirestore,
      collection,
      query,
      where,
      getDocs,
      doc,
      updateDoc
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // 🔴 YOUR Firebase config
    // 🔴 YOUR Firebase config
    // 🔐 Firebase configuration (SAME as other pages)
    const firebaseConfig = {
      apiKey: "AIzaSyCyfEhO3Q_eHGRfOMtHnnKzI523Lgz_bhI",
      authDomain: "computational-linguistic-1b41b.firebaseapp.com",
      projectId: "computational-linguistic-1b41b",
      storageBucket: "computational-linguistic-1b41b.firebasestorage.app",
      messagingSenderId: "408809821572",
      appId: "1:408809821572:web:33808243519db3e0e4f9d1",
      measurementId: "G-1Q62E3KX17"
    };

    const ADMINS = [
      "shoaibtahirr411@gmail.com"
    ];

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const list = document.getElementById("applications");
    const statusBox = document.getElementById("status");

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        alert("Please login as admin");
        window.location.href = "login.html";
        return;
      }

      if (!ADMINS.includes(user.email)) {
        alert("Access denied: Not an admin");
        window.location.href = "index.html";
        return;
      }

      statusBox.innerText = "Loading applications...";

      try {
        const q = query(
          collection(db, "users"),
          where("status", "==", "pending")
        );

        const snapshot = await getDocs(q);

        if (snapshot.empty) {
          statusBox.innerText = "No pending applications.";
          return;
        }

        list.innerHTML = "";
        statusBox.innerText = "";

        snapshot.forEach((docSnap) => {
          const u = docSnap.data();

          const div = document.createElement("div");
          div.className = "card";

          div.innerHTML = `
            <h3>${u.fullName}</h3>
            <p><strong>Email:</strong> ${u.email}</p>
            <p><strong>Role:</strong> ${u.role}</p>
            <p><strong>Affiliation:</strong> ${u.affiliation}</p>
            <button onclick="approveUser('${docSnap.id}')">Approve</button>
          `;

          list.appendChild(div);
        });

      } catch (err) {
        console.error(err);
        statusBox.innerText = "Error loading applications.";
      }
    });

    window.approveUser = async (uid) => {
      await updateDoc(doc(db, "users", uid), {
        status: "approved"
      });
      alert("User approved");
      location.reload();
    };
  </script>
</head>

<body>
  <nav class="navbar">
    <a href="index.html">Home</a>
    <a href="admin.html">Admin</a>
    <a href="login.html">Logout</a>
  </nav>

  <div class="container">
    <h2>Admin Panel</h2>
    <p id="status">Checking permissions…</p>

    <div id="applications"></div>
  </div>
</body>
</html>
