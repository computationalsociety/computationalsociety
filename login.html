<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
  import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup
  } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
  import {
    getFirestore,
    doc,
    getDoc
  } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

    // 🔐 Firebase configuration (PASTE YOUR REAL VALUES)
    const firebaseConfig = {
      apiKey: "AIzaSyCyfEhO3Q_eHGRfOMtHnnKzI523Lgz_bhI",
      authDomain: "computational-linguistic-1b41b.firebaseapp.com",
      projectId: "computational-linguistic-1b41b",
      storageBucket: "computational-linguistic-1b41b.firebasestorage.app",
      messagingSenderId: "408809821572",
      appId: "1:408809821572:web:33808243519db3e0e4f9d1"
    };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const provider = new GoogleAuthProvider();

  const ADMINS = [
    "shoaibtahir410@gmail.com",
    "shoaibtahir411@gmail.com"
  ];

  document.getElementById("loginBtn").onclick = async () => {
    try {
      const result = await signInWithPopup(auth, provider);
      const user = result.user;

      // Admin
      if (ADMINS.includes(user.email)) {
        window.location.href = "admin.html";
        return;
      }

      const ref = doc(db, "users", user.uid);
      const snap = await getDoc(ref);

      // NEW USER → signup
      if (!snap.exists()) {
        sessionStorage.setItem("signupUID", user.uid);
        window.location.href = "signup.html";
        return;
      }

      const status = snap.data().status;

      if (status === "approved") {
        window.location.href = "dashboard.html";
        return;
      }

      alert("Your application is under review.");

    } catch (e) {
      alert(e.message);
    }
  };
</script>
