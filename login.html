<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Complete Registration</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  <a href="index.html">Home</a>
</nav>

<div class="container">
  <h1>Complete Your Profile</h1>

  <form id="profileForm">
    <input id="fullName" placeholder="Full Name" required>
    <input id="affiliation" placeholder="Affiliation" required>

    <select id="role" required>
      <option value="">Select Role</option>
      <option>Student</option>
      <option>Researcher</option>
      <option>Faculty</option>
      <option>Industry</option>
    </select>

    <input id="country" placeholder="Country" required>
    <textarea id="interest" placeholder="Research Interests" required></textarea>

    <button type="submit">Submit Application</button>
  </form>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } 
    from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
  import { getFirestore, doc, setDoc } 
    from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

    // 🔐 Firebase configuration (PASTE YOUR REAL VALUES)
    const firebaseConfig = {
      apiKey: "AIzaSyCyfEhO3Q_eHGRfOMtHnnKzI523Lgz_bhI",
      authDomain: "computational-linguistic-1b41b.firebaseapp.com",
      projectId: "computational-linguistic-1b41b",
      storageBucket: "computational-linguistic-1b41b.firebasestorage.app",
      messagingSenderId: "408809821572",
      appId: "1:408809821572:web:33808243519db3e0e4f9d1"
    };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let currentUser = null;

  onAuthStateChanged(auth, user => {
    if (!user) window.location.href = "login.html";
    currentUser = user;
  });

  document.getElementById("profileForm").addEventListener("submit", async e => {
    e.preventDefault();

    await setDoc(doc(db, "users", currentUser.uid), {
      email: currentUser.email,
      fullName: fullName.value,
      affiliation: affiliation.value,
      role: role.value,
      country: country.value,
      interest: interest.value,
      status: "pending",
      createdAt: new Date()
    });

    alert("Application submitted. Await admin approval.");
    await signOut(auth);
    window.location.href = "index.html";
  });
</script>

</body>
</html>
