<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Membership | Computational Linguistics Society</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  <a href="index.html">Home</a>
  <a href="login.html">Membership</a>
</nav>

<div class="container">
  <h1>Membership</h1>
  <p class="notice">
    Continue with Google to apply for membership or access your account.
  </p>

  <button id="loginBtn">Continue with Google</button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup } 
    from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
  import { getFirestore, doc, getDoc } 
    from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

    // 🔐 Firebase configuration (PASTE YOUR REAL VALUES)
    const firebaseConfig = {
      apiKey: "AIzaSyCyfEhO3Q_eHGRfOMtHnnKzI523Lgz_bhI",
      authDomain: "computational-linguistic-1b41b.firebaseapp.com",
      projectId: "computational-linguistic-1b41b",
      storageBucket: "computational-linguistic-1b41b.firebasestorage.app",
      messagingSenderId: "408809821572",
      appId: "1:408809821572:web:33808243519db3e0e4f9d1"
    };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const provider = new GoogleAuthProvider();

  const ADMINS = [
    "shoaibtahir410@gmail.com",
    "shoaibtahir411@gmail.com"
  ];

  document.getElementById("loginBtn").addEventListener("click", async () => {
    try {
      const result = await signInWithPopup(auth, provider);
      const user = result.user;

      if (ADMINS.includes(user.email)) {
        window.location.href = "admin.html";
        return;
      }

      const snap = await getDoc(doc(db, "users", user.uid));

      if (!snap.exists()) {
        window.location.href = "signup.html";
        return;
      }

      const status = snap.data().status;

      if (status === "pending") {
        alert("Your application is under review.");
        return;
      }

      if (status === "approved") {
        window.location.href = "dashboard.html";
        return;
      }

      alert("Your application was rejected.");

    } catch (err) {
      alert(err.message);
    }
  });
</script>

</body>
</html>
