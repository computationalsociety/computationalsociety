<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Membership | Computational Linguistics Society</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- MAIN STYLES -->
  <link rel="stylesheet" href="style.css" />

  <!-- GOOGLE FONT -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<!-- ================= NAVBAR ================= -->
<nav class="navbar">
  <div class="nav-left">
    <a href="index.html" class="brand">Computational Linguistics Society</a>
  </div>
  <div class="nav-right">
    <a href="index.html">Home</a>
    <a href="login.html" class="active">Membership</a>
  </div>
</nav>

<!-- ================= MAIN ================= -->
<main class="page-center">

  <div class="card auth-card">

    <h1>Membership Portal</h1>

    <p class="subtitle">
      Sign in with Google to apply for membership or access your account.
    </p>

    <button id="loginBtn" class="google-btn">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
      Continue with Google
    </button>

    <p class="note">
      New members must be approved by the administrator before gaining access.
    </p>

  </div>

</main>

<!-- ================= FIREBASE ================= -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
  import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup
  } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
  import {
    getFirestore,
    doc,
    getDoc
  } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

  // 🔥 YOUR FIREBASE CONFIG
  const firebaseConfig = {
    apiKey: "AIzaSyCyfEhO3Q_eHGRfOMtHnnKzI523Lgz_bhI",
    authDomain: "computational-linguistic-1b41b.firebaseapp.com",
    projectId: "computational-linguistic-1b41b",
    storageBucket: "computational-linguistic-1b41b.firebasestorage.app",
    messagingSenderId: "408809821572",
    appId: "1:408809821572:web:33808243519db3e0e4f9d1"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const provider = new GoogleAuthProvider();

  const ADMINS = [
    "shoaibtahir410@gmail.com",
    "shoaibtahir411@gmail.com"
  ];

  document.getElementById("loginBtn").addEventListener("click", async () => {
    try {
      const result = await signInWithPopup(auth, provider);
      const user = result.user;

      // ADMIN
      if (ADMINS.includes(user.email)) {
        window.location.href = "admin.html";
        return;
      }

      const ref = doc(db, "users", user.uid);
      const snap = await getDoc(ref);

      // NEW USER → SIGNUP
      if (!snap.exists()) {
        sessionStorage.setItem("signupUID", user.uid);
        window.location.href = "signup.html";
        return;
      }

      // EXISTING USER
      if (snap.data().status === "approved") {
        window.location.href = "dashboard.html";
      } else {
        alert("Your membership application is under review.");
      }

    } catch (err) {
      alert(err.message);
      console.error(err);
    }
  });
</script>

</body>
</html>
