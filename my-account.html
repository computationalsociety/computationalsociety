<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Account | Computational Linguistics Society of Pakistan</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>

<nav class="navbar">
  <a href="index.html">Home</a>
  <a href="dashboard.html">Dashboard</a>
  <a href="my-account.html" class="active">My Account</a>
  <a href="login.html">Logout</a>
</nav>

<section class="page-hero">
  <h1>My Account</h1>
  <p>Your official membership profile</p>
</section>

<main class="content">
  <div class="content-card" id="profileData">
    <p>Loading profile…</p>
  </div>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

  const firebaseConfig = {
    /* 🔥 PASTE YOUR REAL FIREBASE CONFIG HERE */
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const profileDiv = document.getElementById("profileData");

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = "login.html";
      return;
    }

    try {
      const snap = await getDoc(doc(db, "users", user.uid));

      if (!snap.exists()) {
        profileDiv.innerHTML = "<p>Profile not found.</p>";
        return;
      }

      const d = snap.data();

      profileDiv.innerHTML = `
        <h2>${d.fullName || "Member"}</h2>
        <p><strong>Email:</strong> ${d.email || "-"}</p>
        <p><strong>Affiliation:</strong> ${d.affiliation || "-"}</p>
        <p><strong>Role:</strong> ${d.role || "-"}</p>
        <p><strong>Status:</strong> <span class="badge">${d.status}</span></p>
      `;
    } catch (err) {
      console.error(err);
      profileDiv.innerHTML = "<p>Error loading profile.</p>";
    }
  });
</script>

<footer class="footer">
  <p>© Computational Linguistics Society of Pakistan</p>
</footer>

</body>
</html>
