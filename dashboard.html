<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Member Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<nav class="navbar">
  <a href="index.html">Home</a>
  <a href="#" id="logoutBtn">Logout</a>
</nav>

<div class="card">
  <h2>My Profile</h2>

  <img id="profilePic" src="" class="avatar" />

  <input type="file" id="photoInput" />

  <input id="fullName" placeholder="Full Name" />
  <input id="education" placeholder="Education" />
  <input id="institution" placeholder="Institution" />
  <input id="designation" placeholder="Designation" />
  <input id="city" placeholder="City" />
  <input id="country" placeholder="Country" />

  <textarea id="about" placeholder="About me"></textarea>

  <button id="saveBtn">Save Profile</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

    // 🔐 Firebase config (same as login.html)
    const firebaseConfig = {
      apiKey: "AIzaSyCyfEhO3Q_eHGRfOMtHnnKzI523Lgz_bhI",
      authDomain: "computational-linguistic-1b41b.firebaseapp.com",
      projectId: "computational-linguistic-1b41b",
      storageBucket: "computational-linguistic-1b41b.firebasestorage.app",
      messagingSenderId: "408809821572",
      appId: "1:408809821572:web:33808243519db3e0e4f9d1"
    };
  
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);

let currentUser;

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = "login.html";
    return;
  }

  currentUser = user;

  const refDoc = doc(db, "users", user.uid);
  const snap = await getDoc(refDoc);

  if (!snap.exists() || snap.data().status !== "approved") {
    alert("Access denied");
    signOut(auth);
    return;
  }

  const d = snap.data();
  fullName.value = d.fullName || "";
  education.value = d.education || "";
  institution.value = d.institution || "";
  designation.value = d.designation || "";
  city.value = d.city || "";
  country.value = d.country || "";
  about.value = d.about || "";
  profilePic.src = d.photoURL || "https://via.placeholder.com/150";
});

saveBtn.onclick = async () => {
  const refDoc = doc(db, "users", currentUser.uid);

  await updateDoc(refDoc, {
    fullName: fullName.value,
    education: education.value,
    institution: institution.value,
    designation: designation.value,
    city: city.value,
    country: country.value,
    about: about.value
  });

  alert("Profile updated");
};

photoInput.onchange = async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const storageRef = ref(storage, "profiles/" + currentUser.uid);
  await uploadBytes(storageRef, file);
  const url = await getDownloadURL(storageRef);

  await updateDoc(doc(db, "users", currentUser.uid), {
    photoURL: url
  });

  profilePic.src = url;
};

logoutBtn.onclick = () => signOut(auth);
</script>

</body>
</html>
