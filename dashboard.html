<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Member Dashboard | Computational Linguistics Society of Pakistan</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Styles -->
  <link rel="stylesheet" href="style.css" />

  <style>
    body {
      font-family: "Inter", system-ui, sans-serif;
      background: linear-gradient(180deg, #eef3ff, #ffffff);
      margin: 0;
      color: #0f172a;
    }

    nav {
      background: linear-gradient(90deg, #1e3a8a, #2563eb);
      padding: 14px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: white;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
      font-weight: 500;
    }

    .container {
      max-width: 900px;
      margin: 60px auto;
      background: white;
      border-radius: 14px;
      padding: 40px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 26px;
    }

    form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 25px;
    }

    form input, form textarea {
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      font-size: 14px;
    }

    textarea {
      grid-column: span 2;
      min-height: 120px;
      resize: vertical;
    }

    button {
      grid-column: span 2;
      padding: 14px;
      background: linear-gradient(90deg, #2563eb, #1e40af);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.95;
    }
  </style>
</head>
<body>

<nav>
  <div><strong>Computational Linguistics Society of Pakistan</strong></div>
  <div>
    <a href="index.html">Home</a>
    <a href="my-account.html">My Account</a>
    <a href="#" id="logoutBtn">Logout</a>
  </div>
</nav>

<div class="container">
  <h1>Complete / Update Your Profile</h1>
  <p>Please keep your academic profile up to date.</p>

  <form id="profileForm">
    <input type="text" id="fullName" placeholder="Full Name" required />
    <input type="text" id="education" placeholder="Education" />

    <input type="text" id="institution" placeholder="Institution" />
    <input type="text" id="designation" placeholder="Designation" />

    <input type="text" id="city" placeholder="City" />
    <input type="text" id="country" placeholder="Country" />

    <textarea id="about" placeholder="About you"></textarea>

    <button type="submit">Save & Go to My Account</button>
  </form>
</div>

<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

  // 🔴 YOUR FIREBASE CONFIG
    // 🔐 Firebase config (same as login.html)
  const firebaseConfig = {
    apiKey: "AIzaSyCyfEhO3Q_eHGRfOMtHnnKzI523Lgz_bhI",
    authDomain: "computational-linguistic-1b41b.firebaseapp.com",
    projectId: "computational-linguistic-1b41b",
    storageBucket: "computational-linguistic-1b41b.firebasestorage.app",
    messagingSenderId: "408809821572",
    appId: "1:408809821572:web:33808243519db3e0e4f9d1"
};

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const form = document.getElementById("profileForm");

  // Load user data
  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = "login.html";
      return;
    }

    const ref = doc(db, "users", user.uid);
    const snap = await getDoc(ref);

    if (snap.exists()) {
      const d = snap.data();
      fullName.value = d.fullName || "";
      education.value = d.education || "";
      institution.value = d.institution || "";
      designation.value = d.designation || "";
      city.value = d.city || "";
      country.value = d.country || "";
      about.value = d.about || "";
    }
  });

  // Save profile
  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const user = auth.currentUser;
    if (!user) return;

    try {
      await updateDoc(doc(db, "users", user.uid), {
        fullName: fullName.value,
        education: education.value,
        institution: institution.value,
        designation: designation.value,
        city: city.value,
        country: country.value,
        about: about.value,
        updatedAt: new Date()
      });

      // ✅ REDIRECT AFTER SAVE
      window.location.href = "my-account.html";

    } catch (err) {
      alert("Error updating profile");
      console.error(err);
    }
  });

  // Logout
  document.getElementById("logoutBtn").onclick = async () => {
    await signOut(auth);
    window.location.href = "login.html";
  };
</script>

</body>
</html>
